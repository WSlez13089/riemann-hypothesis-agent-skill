name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-gate:
    name: Test & Self-Gate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run offline unit tests
        run: python -W error -m unittest discover -s scripts -v

      - name: Run rh-arch-gate strict self-audit
        run: python scripts/rh_arch_gate.py audit scripts --config .rh-arch.json --strict --json

      - name: Verify zero-dependency CLI packaging
        run: |
          python -m pip install --no-deps .
          rh-arch-gate audit scripts --config .rh-arch.json --strict --json
